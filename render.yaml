# Servicio web de la publicación gratuita. Sin secretos.
#
# DATABASE_URL y SESSION_SECRET se escriben en el panel de Render.
# La migración no va en este archivo: el plan gratis no tiene preDeployCommand,
# y el proceso HTTP no migra. Los pasos están en docs/development/publicar.md.
# La propuesta es ADR-016.

services:
  - type: web
    name: rancho
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
