<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pesaje</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5C3F}a:hover{color:#163F2B}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F3EE;font-family:Inter,system-ui,sans-serif;color:#1C1F1A;display:flex;flex-direction:column;position:relative;overflow:hidden">
  <header style="padding:16px 20px 10px;display:flex;align-items:center;gap:12px">
    <a href="Hato.dc.html" aria-label="Regresar al hato" style="width:44px;height:44px;border-radius:14px;border:1px solid #E3E0D8;background:#fff;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1F1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div style="flex:1">
      <h1 style="margin:0;font-family:Archivo,sans-serif;font-size:24px;font-weight:800">Pesaje</h1>
      <button style="margin-top:2px;border:0;background:transparent;padding:0;font:inherit;font-size:14px;color:#1F5C3F;font-weight:600;display:flex;align-items:center;gap:4px">
        Lunes 24 de noviembre
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F5C3F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
  </header>

  <div style="margin:0 20px;background:#fff;border-radius:16px;padding:12px 14px;border:1px solid #ECE9E2">
    <div style="display:flex;justify-content:space-between;font-size:14px">
      <span style="font-weight:600">6 de 9 pesados</span>
      <span style="color:#5C6258">1 no se pesó · 2 faltan</span>
    </div>
    <div style="margin-top:8px;height:8px;border-radius:99px;background:#ECE9E2;display:flex;overflow:hidden">
      <span style="width:67%;background:#1F5C3F"></span>
      <span style="width:11%;background:#D9A55B"></span>
    </div>
  </div>

  <div style="flex:1;overflow:hidden;padding:12px 20px 0;display:flex;flex-direction:column;gap:8px">
    <div style="background:#fff;border:2px solid #1F5C3F;border-radius:18px;padding:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-weight:600;font-size:17px">Pinto</span>
        <span style="font-size:13px;color:#5C6258">Antes: 153 kg · hace 15 días</span>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;align-items:stretch">
        <label for="kilos" style="position:absolute;left:-9999px">Kilos de Pinto</label>
        <div style="flex:1;display:flex;align-items:center;border:1px solid #CFCBC1;border-radius:14px;padding:0 14px;height:58px;background:#FBFAF7">
          <input id="kilos" value="158" inputmode="decimal" style="border:0;outline:0;background:transparent;font-family:Archivo,sans-serif;font-weight:700;font-size:28px;width:100%">
          <span style="font-size:16px;color:#5C6258;font-weight:600">kg</span>
        </div>
        <button aria-label="Tomar foto de la báscula" style="width:58px;border-radius:14px;border:1px solid #CFCBC1;background:#fff;display:flex;align-items:center;justify-content:center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1F1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <span style="font-size:13px;font-weight:600;color:#8A4B00;background:#FDF1DE;padding:3px 9px;border-radius:99px">+5 kg · 0.33 kg/día</span>
        <button style="border:0;background:transparent;font:inherit;font-size:13px;color:#5C6258;display:flex;align-items:center;gap:4px">Medido en báscula
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5C6258" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button style="flex:1;height:44px;border-radius:12px;border:1px solid #E3E0D8;background:#fff;font:inherit;font-size:14px;font-weight:600;color:#5C6258">No se pesó</button>
        <button style="flex:1;height:44px;border-radius:12px;border:0;background:#1C1F1A;color:#fff;font:inherit;font-size:14px;font-weight:600">Siguiente</button>
      </div>
    </div>

    <sc-for list="{{filas}}" as="f" hint-placeholder-count="4">
      <div style="background:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;border:1px solid #ECE9E2;opacity:{{f.opacidad}}">
        <span style="width:28px;height:28px;border-radius:99px;background:{{f.fondo}};display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{f.tinta}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.icono}}"/></svg>
        </span>
        <span style="flex:1;font-weight:600;font-size:15px">{{f.nombre}}</span>
        <span style="font-size:14px;color:#5C6258">{{f.estado}}</span>
        <span style="font-family:Archivo,sans-serif;font-weight:700;font-size:16px;min-width:56px;text-align:right">{{f.peso}}</span>
      </div>
    </sc-for>

    <button style="height:48px;border-radius:14px;border:1.5px dashed #CFCBC1;background:transparent;font:inherit;font-size:15px;font-weight:600;color:#1F5C3F;display:flex;align-items:center;justify-content:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F5C3F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Agregar otro animal
    </button>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:14px 20px 22px;background:#fff;border-top:1px solid #E3E0D8">
    <button style="width:100%;height:56px;border-radius:16px;border:0;background:#1F5C3F;color:#fff;font:inherit;font-size:17px;font-weight:600">Guardar pesaje (6)</button>
    <p style="margin:8px 0 0;text-align:center;font-size:12px;color:#5C6258">Se guarda en el celular mientras capturas</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var listo = { fondo: '#E6EFE9', tinta: '#1F5C3F', icono: 'M5 12l5 5 9-10', opacidad: 1 };
    var hueco = { fondo: '#FDF1DE', tinta: '#8A4B00', icono: 'M6 6l12 12M18 6 6 18', opacidad: 1 };
    var falta = { fondo: '#EFEDE8', tinta: '#5C6258', icono: 'M12 7v5l3 2', opacidad: 0.75 };
    return {
      filas: [
        Object.assign({ nombre: 'Canela', estado: '+14 kg', peso: '184 kg' }, listo),
        Object.assign({ nombre: 'Lucero', estado: '+12 kg', peso: '171 kg' }, listo),
        Object.assign({ nombre: 'Negra', estado: 'No se pesó', peso: '' }, hueco),
        Object.assign({ nombre: 'Tordillo', estado: 'Falta', peso: '' }, falta)
      ]
    };
  }
}
</script>
</body>
</html>
